services:
  db:
    image: postgres:16
    volumes:
      - postgres_data_16:/var/lib/postgresql/data
    command: "postgres -c 'max_connections=500'"
    environment:
      POSTGRES_DB: backend_development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    command: "bundle exec rails s -p 3000 -b '0.0.0.0'"
    volumes:
      - ./backend:/app
    ports:
      - '3000:3000'
    depends_on:
      - db

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - '4000:4000'
    environment:
      - CHOKIDAR_USEPOLLING=true
    links:
      - backend
    command: npm start

volumes:
  postgres_data_16: {}